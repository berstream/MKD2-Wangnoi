<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MKD2 — ระบบลงเวลา</title>
<style>
/* ============================================================
   THEME VARIABLES
   ============================================================ */
:root { --transition: 0.25s cubic-bezier(.4,0,.2,1); }

[data-theme="dark"] {
  --bg:       #0b0f1a;
  --bg2:      #111827;
  --bg3:      #1a2235;
  --card:     #161d2f;
  --border:   #2a3a58;
  --border2:  #1e2d47;
  --text:     #e2e8f8;
  --text2:    #7a8db0;
  --text3:    #4a5a7a;
  --green:    #00e676;
  --green2:   rgba(0,230,118,0.12);
  --red:      #ff5252;
  --red2:     rgba(255,82,82,0.12);
  --blue:     #4fc3f7;
  --yellow:   #ffd740;
  --grad-in:  linear-gradient(135deg,#00e676,#00bfa5);
  --grad-out: linear-gradient(135deg,#ff5252,#d50000);
  --shadow:   0 8px 32px rgba(0,0,0,.55);
  --shadow2:  0 2px 8px rgba(0,0,0,.35);
  --glow-g:   0 0 10px rgba(0,230,118,.4);
  --glow-r:   0 0 10px rgba(255,82,82,.4);
  --glow-b:   0 0 10px rgba(79,195,247,.3);
}

[data-theme="light"] {
  --bg:       #f0f4fc;
  --bg2:      #ffffff;
  --bg3:      #f5f8ff;
  --card:     #ffffff;
  --border:   #dde4f4;
  --border2:  #e8eef8;
  --text:     #1a2340;
  --text2:    #5a6890;
  --text3:    #9aa8c8;
  --green:    #00b96b;
  --green2:   rgba(0,185,107,0.10);
  --red:      #e53935;
  --red2:     rgba(229,57,53,0.10);
  --blue:     #1976d2;
  --yellow:   #f9a825;
  --grad-in:  linear-gradient(135deg,#00c853,#009688);
  --grad-out: linear-gradient(135deg,#e53935,#b71c1c);
  --shadow:   0 8px 32px rgba(30,50,120,.12);
  --shadow2:  0 2px 8px rgba(30,50,120,.08);
  --glow-g:   0 0 8px rgba(0,185,107,.25);
  --glow-r:   0 0 8px rgba(229,57,53,.25);
  --glow-b:   0 0 8px rgba(25,118,210,.2);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body {
  font-family: 'Segoe UI','Noto Sans Thai',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  position: sticky; top:0; z-index:200;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow2);
  transition: background var(--transition), border-color var(--transition);
}
.header-left { display:flex; align-items:center; gap:10px; }
.header-logo { font-size:22px; }
.header-text .title { font-size:16px; font-weight:700; letter-spacing:.3px; }
.header-text .sub { font-size:11px; color:var(--text2); margin-top:1px; }

.theme-btn {
  position:relative;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 7px 14px;
  cursor: pointer;
  display: flex; align-items:center; gap:6px;
  font-size: 13px; font-weight:600;
  color: var(--text);
  transition: all var(--transition);
  white-space: nowrap;
}
.theme-btn:hover { border-color:var(--blue); box-shadow:var(--glow-b); }
.theme-btn .icon { font-size:15px; transition: transform .4s; }
[data-theme="light"] .theme-btn .icon { transform: rotate(180deg); }

/* ============================================================
   PAGES
   ============================================================ */
.page { display:none; padding:18px; max-width:500px; margin:0 auto; }
.page.active { display:block; animation: fadeUp .25s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ============================================================
   COMPONENTS
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow2);
  transition: background var(--transition), border-color var(--transition);
}

.card-title {
  font-size:14px; font-weight:700; color:var(--text2);
  text-transform: uppercase; letter-spacing:.8px;
  margin-bottom: 14px;
  display: flex; align-items:center; gap:6px;
}

/* STATUS BAR */
.status-bar {
  display:flex; align-items:center; gap:10px;
  padding: 11px 14px;
  border-radius: 12px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  font-size:14px; font-weight:500;
  transition: all var(--transition);
}
.dot {
  width:10px; height:10px; border-radius:50%; flex-shrink:0;
  transition: background .3s, box-shadow .3s;
}
.dot.green  { background:var(--green);  box-shadow:var(--glow-g); }
.dot.red    { background:var(--red);    box-shadow:var(--glow-r); }
.dot.yellow { background:var(--yellow); box-shadow: 0 0 8px rgba(255,215,64,.5); }
.dot.pulse.green { animation: pulseG 1.5s infinite; }
@keyframes pulseG {
  0%,100%{ box-shadow: 0 0 6px rgba(0,230,118,.4); }
  50%    { box-shadow: 0 0 16px rgba(0,230,118,.9); }
}

/* ACTION GRID */
.action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }

.action-btn {
  padding: 18px 12px; border-radius:16px;
  border: 2px solid var(--border);
  background: var(--bg3);
  cursor: pointer; text-align:center;
  transition: all var(--transition);
  user-select:none;
}
.action-btn:active { transform:scale(.96); }
.action-btn .ab-dot {
  width:18px; height:18px; border-radius:50%;
  background: var(--border); margin: 0 auto 10px;
  transition: all var(--transition);
}
.action-btn .ab-label { font-size:15px; font-weight:700; }

.action-btn.sel-in  { border-color:var(--green); background:var(--green2); }
.action-btn.sel-out { border-color:var(--red);   background:var(--red2); }
.action-btn.sel-in  .ab-dot { background:var(--green); box-shadow:var(--glow-g); }
.action-btn.sel-out .ab-dot { background:var(--red);   box-shadow:var(--glow-r); }
.action-btn.sel-in  .ab-label { color:var(--green); }
.action-btn.sel-out .ab-label { color:var(--red); }

/* INPUT */
.input-group { margin-bottom:14px; }
.input-label { font-size:12px; font-weight:600; color:var(--text2); letter-spacing:.5px; text-transform:uppercase; display:block; margin-bottom:6px; }

.input-field {
  width:100%; padding:13px 15px;
  border-radius:12px;
  border: 1.5px solid var(--border);
  background: var(--bg3);
  color: var(--text);
  font-size:16px; font-weight:600; letter-spacing:1px;
  transition: border-color var(--transition), box-shadow var(--transition);
  -webkit-appearance:none;
}
.input-field:focus { outline:none; border-color:var(--blue); box-shadow:var(--glow-b); }
.input-field::placeholder { color:var(--text3); font-weight:400; letter-spacing:0; }

/* SUBMIT BUTTON */
.submit-btn {
  width:100%; padding:16px;
  border-radius:14px; border:none;
  font-size:16px; font-weight:700;
  cursor:pointer; color:#fff;
  transition: all var(--transition);
  display:flex; align-items:center; justify-content:center; gap:8px;
  position:relative; overflow:hidden;
}
.submit-btn::after {
  content:''; position:absolute; inset:0;
  background:rgba(255,255,255,0);
  transition: background .15s;
}
.submit-btn:hover::after { background:rgba(255,255,255,0.08); }
.submit-btn:active::after { background:rgba(0,0,0,0.12); }
.submit-btn:active { transform:scale(.98); }
.submit-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
.submit-btn.btn-in  { background:var(--grad-in); }
.submit-btn.btn-out { background:var(--grad-out); }
.submit-btn.btn-neu { background:var(--bg3); border:1px solid var(--border); color:var(--text); }

/* SPINNER */
.spinner {
  display:inline-block; width:17px; height:17px;
  border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
.btn-neu .spinner { border-top-color:var(--text); }
@keyframes spin { to{ transform:rotate(360deg) } }

/* DISTANCE NOTE */
.dist-note { text-align:center; font-size:13px; color:var(--text2); margin-top:10px; min-height:20px; }
.dist-note strong { color:var(--text); }

/* ERROR BOX */
.err-box {
  background:var(--red2); border:1px solid var(--red);
  border-radius:12px; padding:12px 14px;
  font-size:13px; color:var(--text);
  margin-bottom:14px;
  display:none;
  animation: fadeUp .2s ease;
}
.err-box.show { display:block; }

/* TOAST */
.toast {
  position:fixed; top:16px; left:50%;
  transform:translateX(-50%) translateY(-100px);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 20px;
  min-width:260px; max-width:340px;
  text-align:center;
  box-shadow:var(--shadow);
  z-index:999;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.t-ok  { border-top:3px solid var(--green); }
.toast.t-err { border-top:3px solid var(--red); }
.toast .t-icon { font-size:22px; margin-bottom:4px; }
.toast .t-msg  { font-size:14px; }

/* HOME */
.home-hero {
  text-align:center; padding:28px 0 20px;
}
.home-hero .h-logo { font-size:60px; margin-bottom:6px; }
.home-hero .h-title { font-size:26px; font-weight:800; letter-spacing:-.5px; }
.home-hero .h-sub { font-size:14px; color:var(--text2); margin-top:4px; }

.menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.menu-card {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px 16px;
  text-align:center;
  cursor:pointer;
  transition: all var(--transition);
  box-shadow:var(--shadow2);
}
.menu-card:hover { border-color:var(--blue); transform:translateY(-2px); box-shadow:var(--shadow); }
.menu-card:active { transform:scale(.97); }
.menu-card .m-icon  { font-size:36px; margin-bottom:8px; }
.menu-card .m-title { font-size:15px; font-weight:700; }
.menu-card .m-sub   { font-size:12px; color:var(--text2); margin-top:3px; }
.menu-card.c-green  { border-color:var(--green); }
.menu-card.c-blue   { border-color:var(--blue); }

/* BACK BTN */
.back-btn {
  background:none; border:none; color:var(--blue);
  font-size:14px; font-weight:600; cursor:pointer;
  padding:6px 0; margin-bottom:14px;
  display:flex; align-items:center; gap:4px;
  transition:opacity .2s;
}
.back-btn:hover { opacity:.7; }

/* PAGE TITLE */
.page-title { font-size:22px; font-weight:800; margin-bottom:18px; display:flex; align-items:center; gap:8px; }

/* RESULT */
.result-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:28px 20px;
  text-align:center; box-shadow:var(--shadow);
}
.result-card .r-icon  { font-size:56px; margin-bottom:12px; }
.result-card .r-title { font-size:22px; font-weight:800; margin-bottom:12px; }
.result-card .r-rows  { text-align:left; display:inline-block; }
.r-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border2); font-size:15px; }
.r-row:last-child { border-bottom:none; }
.r-row .r-key { color:var(--text2); font-size:13px; width:90px; flex-shrink:0; }
.r-row .r-val { font-weight:600; }
.r-badge {
  display:inline-block; padding:3px 12px; border-radius:20px;
  font-size:12px; font-weight:700;
}
.r-badge.in  { background:var(--green2); color:var(--green); }
.r-badge.out { background:var(--red2);   color:var(--red); }
.r-badge.ot  { background:rgba(255,215,64,.15); color:var(--yellow); }

/* ADMIN */
.date-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.btn-row  { display:flex; gap:8px; flex-wrap:wrap; }
.sm-btn {
  padding:9px 16px; border-radius:10px;
  border:1px solid var(--border);
  background:var(--bg3); color:var(--text);
  font-size:13px; font-weight:600; cursor:pointer;
  transition:all var(--transition); white-space:nowrap;
}
.sm-btn:hover { border-color:var(--blue); }
.sm-btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
.sm-btn.primary:hover { opacity:.88; }
.sm-btn:disabled { opacity:.4; cursor:not-allowed; }

.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead tr { background:var(--bg3); }
th { padding:10px 10px; text-align:left; font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text2); border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px 10px; border-bottom:1px solid var(--border2); color:var(--text); }
tr:last-child td { border-bottom:none; }

.tag {
  display:inline-block; padding:3px 10px; border-radius:20px;
  font-size:12px; font-weight:700;
}
.tag.in  { background:var(--green2); color:var(--green); }
.tag.out { background:var(--red2);   color:var(--red); }

/* LOADING PLACEHOLDER */
.loading-ph {
  text-align:center; padding:30px;
  color:var(--text2); font-size:14px;
}

/* RESPONSIVE */
@media(max-width:400px){
  .page { padding:14px; }
  .menu-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-left">
    <div class="header-logo">🏭</div>
    <div class="header-text">
      <div class="title">MKD2 Wangnoi</div>
      <div class="sub">Makro Distribution Center</div>
    </div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
    <span class="icon">🌙</span>
    <span id="themeTxt">มืด</span>
  </button>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast">
  <div class="t-icon" id="tIcon"></div>
  <div class="t-msg"  id="tMsg"></div>
</div>

<!-- ======================================================
     PAGE: HOME
     ====================================================== -->
<div class="page active" id="pgHome">
  <div class="home-hero">
    <div class="h-logo">🏭</div>
    <div class="h-title">MKD2 Wangnoi</div>
    <div class="h-sub">ระบบลงเวลาเข้า-ออกงาน</div>
  </div>

  <div class="menu-grid">
    <div class="menu-card c-green" onclick="showPage('pgCheckin')">
      <div class="m-icon">🕐</div>
      <div class="m-title">ลงเวลางาน</div>
      <div class="m-sub">เข้างาน / ออกงาน</div>
    </div>
    <div class="menu-card c-blue" onclick="showPage('pgAdmin')">
      <div class="m-icon">📊</div>
      <div class="m-title">รายงาน</div>
      <div class="m-sub">ข้อมูลการเข้างาน</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ สถานะระบบ</div>
    <div class="status-bar" id="svrBar">
      <div class="dot yellow" id="svrDot"></div>
      <span id="svrTxt">กำลังตรวจสอบ...</span>
    </div>
  </div>
</div>

<!-- ======================================================
     PAGE: CHECKIN
     ====================================================== -->
<div class="page" id="pgCheckin">
  <button class="back-btn" onclick="showPage('pgHome')">← กลับหน้าหลัก</button>
  <div class="page-title">🕐 ลงเวลาเข้า-ออกงาน</div>

  <!-- GPS -->
  <div class="status-bar" id="gpsBar" style="margin-bottom:14px;">
    <div class="dot yellow pulse" id="gpsDot"></div>
    <span id="gpsTxt">กำลังระบุตำแหน่ง...</span>
  </div>

  <!-- Error -->
  <div class="err-box" id="errBox"></div>

  <!-- Action -->
  <div class="action-grid">
    <div class="action-btn sel-in" id="aIn" onclick="selAction('in')">
      <div class="ab-dot"></div>
      <div class="ab-label">เข้างาน</div>
    </div>
    <div class="action-btn" id="aOut" onclick="selAction('out')">
      <div class="ab-dot"></div>
      <div class="ab-label">ออกงาน</div>
    </div>
  </div>

  <!-- EMP ID -->
  <div class="input-group">
    <label class="input-label">รหัสพนักงาน</label>
    <input type="text" class="input-field" id="empId"
           placeholder="เช่น TH061378" maxlength="20"
           oninput="this.value=this.value.toUpperCase()">
  </div>

  <!-- Submit -->
  <button class="submit-btn btn-in" id="subBtn" onclick="doSubmit()">
    ✅ บันทึกเข้างาน
  </button>

  <div class="dist-note" id="distNote"></div>
</div>

<!-- ======================================================
     PAGE: RESULT
     ====================================================== -->
<div class="page" id="pgResult">
  <button class="back-btn" onclick="showPage('pgCheckin')">← ลงเวลาอีกครั้ง</button>
  <div class="result-card" id="rCard"></div>
  <button class="submit-btn btn-neu" style="margin-top:14px;" onclick="showPage('pgHome')">
    🏠 กลับหน้าหลัก
  </button>
</div>

<!-- ======================================================
     PAGE: ADMIN
     ====================================================== -->
<div class="page" id="pgAdmin">
  <button class="back-btn" onclick="showPage('pgHome')">← กลับหน้าหลัก</button>
  <div class="page-title">📊 รายงานการเข้างาน</div>

  <!-- Login -->
  <div class="card" id="admLogin">
    <div style="text-align:center;margin-bottom:18px;">
      <div style="font-size:40px;">🔐</div>
      <div style="font-weight:700;margin-top:8px;font-size:17px;">ยืนยันตัวตนผู้ดูแล</div>
    </div>
    <div class="input-group">
      <label class="input-label">รหัสผ่าน</label>
      <input type="password" class="input-field" id="admPass" placeholder="••••••"
             onkeydown="if(event.key==='Enter')doAdmLogin()">
    </div>
    <button class="submit-btn btn-in" onclick="doAdmLogin()">เข้าสู่ระบบ</button>
  </div>

  <!-- Panel -->
  <div id="admPanel" style="display:none;">
    <div class="card">
      <div class="card-title">📅 เลือกช่วงเวลา</div>
      <div class="date-row">
        <div>
          <label class="input-label">วันที่เริ่ม</label>
          <input type="date" class="input-field" id="dFrom" style="font-size:14px;padding:11px 12px;">
        </div>
        <div>
          <label class="input-label">วันที่สิ้นสุด</label>
          <input type="date" class="input-field" id="dTo" style="font-size:14px;padding:11px 12px;">
        </div>
      </div>
      <div class="btn-row">
        <button class="sm-btn" onclick="qToday()">วันนี้</button>
        <button class="sm-btn" onclick="qWeek()">สัปดาห์นี้</button>
        <button class="sm-btn" onclick="qMonth()">เดือนนี้</button>
        <button class="sm-btn primary" onclick="doReport()" id="rptBtn">🔍 โหลด</button>
      </div>
    </div>
    <div id="rptOut"></div>
  </div>
</div>

<!-- ======================================================
     SCRIPT
     ====================================================== -->
<script>
// ============================================================
// ⚙️  CONFIG — วาง URL ของ GAS Web App ตรงนี้
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxv_PGtkk09qrTtd00QTaGcblUR-25QTptLlonfyZABQUTKMEeVl8RCA8K5nEsnNTyPEA/exec';
// วิธีหา URL: GAS → Deploy → Manage deployments → Copy URL

const ADMIN_PASS = 'mkd2admin';

// ============================================================
//  THEME
// ============================================================
let theme = localStorage.getItem('mkd2theme') || 'dark';

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').title = t === 'dark' ? 'เปลี่ยนเป็นธีมสว่าง' : 'เปลี่ยนเป็นธีมมืด';
  document.getElementById('themeTxt').textContent = t === 'dark' ? 'สว่าง' : 'มืด';
  localStorage.setItem('mkd2theme', t);
}

function toggleTheme() {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(theme);
}

applyTheme(theme);

// ============================================================
//  NAVIGATION
// ============================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (id === 'pgCheckin') startGPS();
}

// ============================================================
//  TOAST
// ============================================================
let toastTimer;
function toast(icon, msg, type = 'ok', ms = 3500) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast');
  document.getElementById('tIcon').textContent = icon;
  document.getElementById('tMsg').textContent  = msg;
  el.className = `toast t-${type} show`;
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ============================================================
//  GPS
// ============================================================
let uLat = null, uLng = null, uDist = null;
const OFF_LAT = 14.1788252;
const OFF_LNG = 100.6490192;
const MAX_M   = 100;

function haversine(la1, lo1, la2, lo2) {
  const R = 6371000, r = Math.PI / 180;
  const dlat = (la2 - la1) * r, dlng = (lo2 - lo1) * r;
  const a = Math.sin(dlat/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dlng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function setGPS(color, txt) {
  const d = document.getElementById('gpsDot');
  d.className = 'dot ' + color + (color === 'green' ? ' pulse' : '');
  document.getElementById('gpsTxt').textContent = txt;
}

function startGPS() {
  uLat = uLng = uDist = null;
  setGPS('yellow', 'กำลังระบุตำแหน่ง...');
  document.getElementById('distNote').textContent = '';
  if (!navigator.geolocation) { setGPS('red', 'เบราว์เซอร์ไม่รองรับ GPS'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      uLat  = pos.coords.latitude;
      uLng  = pos.coords.longitude;
      uDist = haversine(uLat, uLng, OFF_LAT, OFF_LNG);
      const d = Math.round(uDist);
      if (uDist <= MAX_M) {
        setGPS('green', `✓ ตำแหน่งถูกต้อง (ห่าง ${d} ม.)`);
      } else {
        setGPS('red', `✗ อยู่นอกพื้นที่ (ห่าง ${d} ม.)`);
      }
      document.getElementById('distNote').innerHTML = `ห่างจากสำนักงาน <strong>${d} เมตร</strong>`;
    },
    err => {
      const msgs = ['', 'กรุณาอนุญาตการเข้าถึงตำแหน่ง', 'ไม่พบสัญญาณ GPS', 'GPS หมดเวลา'];
      setGPS('red', msgs[err.code] || 'ระบุตำแหน่งไม่ได้');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ============================================================
//  ACTION SELECT
// ============================================================
let action = 'in';

function selAction(a) {
  action = a;
  document.getElementById('aIn').className  = 'action-btn' + (a === 'in'  ? ' sel-in'  : '');
  document.getElementById('aOut').className = 'action-btn' + (a === 'out' ? ' sel-out' : '');
  const btn = document.getElementById('subBtn');
  if (a === 'in') {
    btn.innerHTML = '✅ บันทึกเข้างาน';
    btn.className = 'submit-btn btn-in';
  } else {
    btn.innerHTML = '🚪 บันทึกออกงาน';
    btn.className = 'submit-btn btn-out';
  }
}

// ============================================================
//  *** CORE FIX: callGAS — ใช้ GET + ?payload=... ***
// ============================================================
async function callGAS(obj) {
  if (GAS_URL === 'PASTE_YOUR_GAS_WEBAPP_URL_HERE') {
    throw new Error('ยังไม่ได้ตั้งค่า GAS_URL ในไฟล์ HTML');
  }
  const url = GAS_URL + '?payload=' + encodeURIComponent(JSON.stringify(obj));
  const res  = await fetch(url, { method: 'GET' });
  const text = await res.text();

  // *** ตรวจว่าได้ HTML กลับมาแทน JSON (สาเหตุ error เดิม) ***
  if (text.trimStart().startsWith('<')) {
    throw new Error('GAS ส่ง HTML กลับมา — กรุณา Re-deploy Web App อีกครั้ง\n(Deploy → New deployment → Anyone can access)');
  }
  return JSON.parse(text);
}

// ============================================================
//  SUBMIT CHECKIN
// ============================================================
async function doSubmit() {
  const id  = document.getElementById('empId').value.trim().toUpperCase();
  const err = document.getElementById('errBox');
  err.classList.remove('show');

  if (!id)         { showErr('กรุณากรอกรหัสพนักงาน'); return; }
  if (!uLat)       { showErr('ยังไม่ได้รับตำแหน่ง GPS กรุณารอสักครู่'); return; }
  if (uDist > MAX_M) { showErr(`อยู่นอกพื้นที่ (ห่าง ${Math.round(uDist)} ม.) ต้องอยู่ภายใน ${MAX_M} ม.`); return; }

  const btn = document.getElementById('subBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก...';

  try {
    const data = await callGAS({
      action:     action === 'in' ? 'checkin' : 'checkout',
      employeeId: id,
      lat:  uLat,
      lng:  uLng,
      dist: Math.round(uDist),
      ts:   new Date().toISOString()
    });

    if (data.success) {
      showResult(data);
      showPage('pgResult');
      toast('✅', action === 'in' ? 'บันทึกเข้างานสำเร็จ' : 'บันทึกออกงานสำเร็จ', 'ok');
    } else {
      showErr(data.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
    }
  } catch (e) {
    showErr('⚠️ ' + e.message);
    toast('❌', 'เชื่อมต่อไม่ได้', 'err', 5000);
  } finally {
    btn.disabled = false;
    selAction(action);
  }
}

function showErr(msg) {
  const b = document.getElementById('errBox');
  b.textContent = msg; b.classList.add('show');
}

// ============================================================
//  RESULT PAGE
// ============================================================
function showResult(d) {
  const isIn = d.type === 'checkin';
  const rows = [
    d.name        && ['👤 ชื่อ',       d.name],
    d.position    && ['🏷️ ตำแหน่ง',    d.position],
    d.employeeId  && ['🪪 รหัส',        d.employeeId],
    d.date        && ['📅 วันที่',       d.date],
    d.time        && ['🕐 เวลา',         d.time],
    d.workHours   && ['⏱️ ชั่วโมง',      d.workHours + ' ชม.'],
    d.ot          && ['⭐ OT',           d.ot + ' ชม.'],
  ].filter(Boolean);

  const rowsHTML = rows.map(([k, v]) =>
    `<div class="r-row"><span class="r-key">${k}</span><span class="r-val">${v}</span></div>`
  ).join('');

  document.getElementById('rCard').innerHTML = `
    <div class="r-icon">${isIn ? '✅' : '👋'}</div>
    <div class="r-title">${isIn ? 'บันทึกเข้างานสำเร็จ' : 'บันทึกออกงานสำเร็จ'}</div>
    <div class="r-rows">${rowsHTML}</div>
    ${d.ot ? `<div style="margin-top:14px;"><span class="r-badge ot">OT ${d.ot} ชม.</span></div>` : ''}
  `;
}

// ============================================================
//  ADMIN
// ============================================================
function doAdmLogin() {
  if (document.getElementById('admPass').value === ADMIN_PASS) {
    document.getElementById('admLogin').style.display = 'none';
    document.getElementById('admPanel').style.display = 'block';
    qToday(); doReport();
  } else {
    toast('❌', 'รหัสผ่านไม่ถูกต้อง', 'err');
  }
}

function fmt(d) { return d.toISOString().split('T')[0]; }

function qToday()  { const t=fmt(new Date()); document.getElementById('dFrom').value=t; document.getElementById('dTo').value=t; }
function qWeek()   {
  const n=new Date(), day=n.getDay();
  const m=new Date(n); m.setDate(n.getDate()-(day===0?6:day-1));
  const s=new Date(m); s.setDate(m.getDate()+6);
  document.getElementById('dFrom').value=fmt(m); document.getElementById('dTo').value=fmt(s);
}
function qMonth()  {
  const n=new Date();
  document.getElementById('dFrom').value=fmt(new Date(n.getFullYear(),n.getMonth(),1));
  document.getElementById('dTo').value  =fmt(new Date(n.getFullYear(),n.getMonth()+1,0));
}

async function doReport() {
  const from=document.getElementById('dFrom').value, to=document.getElementById('dTo').value;
  if (!from||!to) { toast('⚠️','กรุณาเลือกช่วงวันที่','err'); return; }
  const btn=document.getElementById('rptBtn'), out=document.getElementById('rptOut');
  btn.disabled=true; btn.innerHTML='<span class="spinner" style="border-top-color:#fff;margin-right:4px;"></span>โหลด';
  out.innerHTML='<div class="loading-ph">⏳ กำลังโหลดข้อมูล...</div>';
  try {
    const d = await callGAS({ action:'report', dateFrom:from, dateTo:to });
    if (!d.success || !d.rows || !d.rows.length) {
      out.innerHTML='<div class="card" style="text-align:center;"><div style="font-size:36px;">📭</div><div style="margin-top:8px;color:var(--text2);">ไม่พบข้อมูลในช่วงนี้</div></div>';
      return;
    }
    renderReport(d.rows);
  } catch(e) {
    out.innerHTML=`<div class="card" style="color:var(--red);">⚠️ ${e.message}</div>`;
  } finally { btn.disabled=false; btn.innerHTML='🔍 โหลด'; }
}

function renderReport(rows) {
  const html = `
    <div class="card">
      <div class="card-title" style="margin-bottom:12px;">📋 รายการ ${rows.length} รายการ</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>รหัส</th><th>ชื่อ</th><th>ประเภท</th><th>วันที่</th><th>เวลา</th></tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>
              <td>${r.employeeId||''}</td>
              <td>${r.name||''}</td>
              <td><span class="tag ${r.type==='checkin'?'in':'out'}">${r.type==='checkin'?'เข้า':'ออก'}</span></td>
              <td>${r.date||''}</td>
              <td>${r.time||''}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  document.getElementById('rptOut').innerHTML = html;
}

  try {
    if (GAS_URL === 'PASTE_YOUR_GAS_WEBAPP_URL_HERE') throw new Error('no url');

    document.getElementById('svrDot').className = 'dot green pulse';

  } catch(e) {
    document.getElementById('svrDot').className = 'dot red';
    document.getElementById('svrTxt').textContent =
      GAS_URL === 'PASTE_YOUR_GAS_WEBAPP_URL_HERE'

        : '✗ เชื่อมต่อไม่ได้ — ตรวจสอบ GAS URL';
  }
}
